  body{
    background:radial-gradient(1200px 600px at 80% -10%, #10243d 0%, transparent 60%), var(--bg);

  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  .code-scroll{overflow-x:auto;}
  @keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .popin{animation:popin .25s ease-out;}
  @keyframes xpfloat{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
  .xpfloat{animation:xpfloat 1.1s ease-out forwards;}
</style>

/* ---------- mini Python-subset interpreter (for Sandbox & write-exercises) ---------- */
function runPy(src){
  try{
    const stripped = src.replace(/\t/g,"    ").split("\n").map(line=>{
      let inS=false,inD=false,out="";
      for(let i=0;i<line.length;i++){
        const c=line[i];
        if(c==="'"&&!inD) inS=!inS; else if(c==='"'&&!inS) inD=!inD;
        if(c==="#"&&!inS&&!inD) break;
        out+=c;
      }
      return out;
    });
    const rows = stripped.map(r=>({indent:(r.match(/^ */)[0]).length, text:r.trim()})).filter(r=>r.text!=="");
    function buildBlock(list){
      const base = list.length?list[0].indent:0; const body=[];
      while(list.length && list[0].indent>=base){
        const node=list.shift(); const children=[];
        while(list.length && list[0].indent>node.indent) children.push(list.shift());
        body.push({text:node.text, children: children.length? buildBlock(children):[]});
      }
      return body;
    }
    const tree = buildBlock(rows.slice());
    function tx(s){
      return s.replace(/\bTrue\b/g,"true").replace(/\bFalse\b/g,"false").replace(/\bNone\b/g,"null")
        .replace(/ and /g," && ").replace(/ or /g," || ").replace(/\bnot /g,"!")
        .replace(/(\S+)\s*\/\/\s*(\S+)/g,"Math.floor(($1)/($2))")
        .replace(/(\S+)\s*\*\*\s*(\S+)/g,"Math.pow($1,$2)");
    }
    function range(a){
      const p=a.split(",").map(x=>x.trim());
      if(p.length===1) return {start:"0",stop:p[0],step:"1"};
      if(p.length===2) return {start:p[0],stop:p[1],step:"1"};
      return {start:p[0],stop:p[1],step:p[2]};
    }
    function emit(nodes){
      let js="";
      for(const n of nodes){
        const t=n.text;
        let m;
        if(/^if .*:$/.test(t)) js+=`if (${tx(t.slice(3,-1))}){\n${emit(n.children)}}\n`;
        else if(/^elif .*:$/.test(t)) js+=`else if (${tx(t.slice(5,-1))}){\n${emit(n.children)}}\n`;
        else if(/^else\s*:$/.test(t)) js+=`else {\n${emit(n.children)}}\n`;
        else if((m=t.match(/^for (\w+) in range\((.*)\):$/))){
          const rg=range(m[2]); const down=rg.step.trim().startsWith("-");
          js+=`for(let ${m[1]}=${rg.start}; ${down?`${m[1]}>${rg.stop}`:`${m[1]}<${rg.stop}`}; ${m[1]}+=(${rg.step})){\n${emit(n.children)}}\n`;
        }
        else if((m=t.match(/^for (\w+) in (.+):$/))) js+=`for(const ${m[1]} of (${tx(m[2])})){\n${emit(n.children)}}\n`;
        else if(/^while .*:$/.test(t)) js+=`while (${tx(t.slice(6,-1))}){\n${emit(n.children)}}\n`;
        else if((m=t.match(/^def (\w+)\((.*)\):$/))) js+=`function ${m[1]}(${m[2]}){\n${emit(n.children)}}\n`;
        else if(/^return\b/.test(t)) js+=`return ${tx(t.slice(7))};\n`;
        else if(t==="pass") js+=";\n";
        else js+=`${tx(t)};\n`;
      }
      return js;
    }
    const body = emit(tree);
    const out=[];
    const fn = new Function("print", body);
    fn((...a)=>out.push(a.map(x=>typeof x==="boolean"?(x?"True":"False"):(x===null?"None":String(x))).join(" ")));
    return {ok:true, output:out.join("\n")};
  }catch(err){
    return {ok:false, output:"", error:String(err.message||err)};
  }
}

function useProgress(){
  const initial = {};
  MODULES.forEach(m => initial[m.key] = {});
  const [progress,setProgress] = useState(initial);
  const [xp,setXp] = useState(0);
  const complete = (mkey, exid) => {
    setProgress(p => ({...p, [mkey]: {...p[mkey], [exid]: true}}));
  };
  const isDone = (mkey, exid) => !!progress[mkey]?.[exid];
  const moduleStats = (mkey) => {
    const mod = MODULES.find(m=>m.key===mkey);
    const done = mod.exercises.filter(e => isDone(mkey, e.id)).length;
    return {done, total: mod.exercises.length};
  };
  const moduleStatus = (idx) => {
    const mkey = MODULES[idx].key;
    const {done,total} = moduleStats(mkey);
    if (done === total) return "mastered";
    if (idx === 0) return done>0 ? "inprogress" : "inprogress";
    const prev = moduleStats(MODULES[idx-1].key);
    if (prev.done < prev.total) return "locked";
    return done>0 ? "inprogress" : "unlocked";
  };
  return {progress, complete, isDone, moduleStats, moduleStatus, xp, setXp};
}

function ProgressBar({done,total,color="#34d399"}){

  return (

      <div className="h-full rounded-full transition-all duration-500" style={{width:pct+"%", background:color}}/>

  );
}

            )}
            {ex.type === "fill" && (
              <div>
                <p className="text-sm text-slate-300 mb-2">Fill in the missing code:</p>
                <input value={fillVal} onChange={e=>setFillVal(e.target.value)} placeholder="type the missing piece..."
                  className="w-full mono text-sm bg-[#0a0f1a] border border-slate-700 rounded-lg px-3 py-2 focus:outline-none"
                  style={{color:accent}} />
              </div>
            )}
            {ex.type === "write" && (
              <p className="text-sm text-slate-400">Write your solution above, then run it to check the output.</p>
            )}

            <div className="flex flex-wrap gap-3 mt-4">
              <button onClick={check} className="px-4 py-2 rounded-lg text-slate-950 font-semibold text-sm flex items-center gap-2" style={{background:accent}}>
                <I.Play s={14}/> Run Code / Check Solution
              </button>
              <button onClick={()=>setShowHint(s=>!s)} className="px-4 py-2 rounded-lg border border-amber-400/40 text-amber-300 hover:bg-amber-400/10 font-semibold text-sm flex items-center gap-2">
                <I.Bulb s={14}/> Get Hint
              </button>
              {exIdx < filtered.length-1 && (
                <button onClick={()=>setExIdx(exIdx+1)} className="px-4 py-2 rounded-lg border border-slate-700 text-slate-300 hover:border-slate-500 font-semibold text-sm ml-auto">
                  Next Exercise →
                </button>
              )}
            </div>

            {showHint && (
              <div className="popin mt-3 text-sm bg-amber-400/10 border border-amber-400/30 text-amber-200 rounded-lg px-4 py-3">
                💡 {ex.hint}
              </div>
            )}
          </div>

          <div className="rounded-2xl border border-slate-800 bg-[#0a0f1a] p-5">
            <p className="mono text-xs text-slate-500 mb-2 flex items-center gap-1.5"><I.Terminal s={13}/> console output</p>
            {result ? (
              <div className="popin mono text-sm" style={{color:result.ok?accent:"#fb7185"}}>
                {result.ok ? (<>
                  <div>&gt;&gt;&gt; {ex.output.split("\n").map((l,i)=><div key={i}>{l}</div>)}</div>
                  <div className="mt-2 flex items-center gap-1.5"><I.Check s={13}/> {result.msg}</div>
                </>) : (
                  <div className="flex items-center gap-1.5"><I.X s={13}/> {result.msg}</div>
                )}
              </div>
            ) : (
              <p className="mono text-sm text-slate-600">// run your code to see output here</p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Sandbox({accent}){
  const [code, setCode] = useState(`# Try some Python here!\nname = "World"\nfor i in range(3):\n    print("Hello,", name, "-", i)`);
  const [out, setOut] = useState(null);
  const run = () => setOut(runPy(code));
  return (
    <div className="max-w-5xl mx-auto px-4 sm:px-6 py-8 space-y-4">
      <div>
        <h1 className="text-2xl font-bold text-white flex items-center gap-2"><I.Terminal s={20}/> Python Sandbox</h1>
        <p className="text-slate-400 text-sm mt-1">Free-form practice space for live demos. Supports core syntax: print, variables, if/elif/else, for/while loops, functions, lists & dicts — no imports, classes, or external libraries.</p>
      </div>
      <div className="rounded-xl border border-slate-700 bg-[#0a0f1a]">
        <div className="flex items-center gap-1.5 px-4 py-2 border-b border-slate-800">
          <span className="w-2.5 h-2.5 rounded-full bg-rose-400/70"/>
          <span className="w-2.5 h-2.5 rounded-full bg-amber-300/70"/>
          <span className="w-2.5 h-2.5 rounded-full bg-emerald-400/70"/>
          <span className="mono text-xs text-slate-500 ml-2">sandbox.py</span>
        </div>
        <textarea value={code} onChange={e=>setCode(e.target.value)} spellCheck="false" rows={12}
          className="w-full mono text-sm bg-transparent p-4 outline-none text-slate-200 resize-y"/>
      </div>
      <button onClick={run} className="px-4 py-2 rounded-lg text-slate-950 font-semibold text-sm flex items-center gap-2" style={{background:accent}}>
        <I.Play s={14}/> Run
      </button>
      <div className="rounded-2xl border border-slate-800 bg-[#0a0f1a] p-5">
        <p className="mono text-xs text-slate-500 mb-2 flex items-center gap-1.5"><I.Terminal s={13}/> console output</p>
        {out ? (
          out.ok ? (
            <div className="mono text-sm" style={{color:accent}}>{(out.output||"(no output)").split("\n").map((l,i)=><div key={i}>{l}</div>)}</div>
          ) : (
            <div className="mono text-sm text-rose-400 flex items-center gap-1.5"><I.X s={13}/> Runtime error: {out.error}</div>
          )
        ) : (
          <p className="mono text-sm text-slate-600">// click Run to see output here</p>
        )}
      </div>
    </div>
  );
}

function App(){
  const stateApi = useProgress();
  const [view, setView] = useState("hub");
  const [modIdx, setModIdx] = useState(0);
  const [themeIdx, setThemeIdx] = useState(0);
  const theme = THEMES[themeIdx];
  const addXp = (n) => { stateApi.setXp(x=>x+n); };
  addXp.current = stateApi.xp;

  const openModule = (idx) => { setModIdx(idx); setView("workspace"); };

  return (
    <div className="min-h-screen">
      <div className="sticky top-0 z-10 backdrop-blur border-b border-slate-800/80" style={{background:"rgba(11,18,32,0.85)"}}>
        <div className="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <div className="flex items-center gap-1 bg-slate-900/70 rounded-lg p-1">
            <button onClick={()=>setView("hub")}
              className={"px-3 py-1.5 rounded-md text-sm font-medium transition "+(view!=="sandbox"?"text-slate-950":"text-slate-400 hover:text-slate-200")}
              style={view!=="sandbox"?{background:theme.hex}:{}}>Curriculum</button>
            <button onClick={()=>setView("sandbox")}
              className={"px-3 py-1.5 rounded-md text-sm font-medium transition flex items-center gap-1.5 "+(view==="sandbox"?"text-slate-950":"text-slate-400 hover:text-slate-200")}
              style={view==="sandbox"?{background:theme.hex}:{}}><I.Terminal s={13}/> Python Sandbox</button>
          </div>
          <div className="flex items-center gap-1.5">
            {THEMES.map((t,i)=>(
              <button key={t.name} title={t.name} onClick={()=>setThemeIdx(i)}
                className={"w-6 h-6 rounded-full border-2 transition"}
                style={{background:t.hex, borderColor: i===themeIdx? "#e2e8f0":"transparent"}}/>
            ))}
          </div>
        </div>
      </div>
      {view==="hub" && <Hub stateApi={stateApi} onOpen={openModule} xp={stateApi.xp} accent={theme.hex}/>}
      {view==="workspace" && <Workspace modIdx={modIdx} stateApi={stateApi} onBack={()=>setView("hub")} addXp={addXp} accent={theme.hex}/>}
      {view==="sandbox" && <Sandbox accent={theme.hex}/>}
      <footer className="text-center text-xs text-slate-600 mono py-8">PyCode Academy · practice environment · sandbox runs a simplified Python-subset interpreter</footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
